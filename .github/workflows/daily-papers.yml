name: Daily Research Paper Agent

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python agent.py

      - name: Commit sent_papers.json
        run: |
          git config --global user.name "Research Agent"
          git config --global user.email "agent@github.com"

          if [ -f sent_papers.json ]; then
            git add sent_papers.json

            if ! git diff --cached --quiet; then
              git commit -m "Update sent papers log"
              git push origin main
            fi
          fi
